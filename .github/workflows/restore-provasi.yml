name: Restore Provası

# Haftalık restore provası: canlı DB'den taze dump alır, izole Postgres 16 service
# container'ına gerçekten geri yükler, tenants duman testini çalıştırır.
# Gerekli secret: BACKUP_DATABASE_URL (backup işiyle aynı).
# REHEARSAL_DATABASE_URL gizli değildir (efemera container); sızdırma riski yok.
on:
  schedule:
    - cron: "30 4 * * 1" # her Pazartesi 04:30 UTC (backup'ın ardından)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-provasi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: provali
          POSTGRES_PASSWORD: provali
          POSTGRES_DB: provadb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provali -d provadb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      REHEARSAL_DATABASE_URL: postgres://provali:provali@localhost:5432/provadb
      BACKUP_DIR: /tmp/cabukpos-backups
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Taze dump al
        run: npm run db:backup
      - name: İzole Postgres 16'ya restore provası
        run: npm run db:restore:rehearsal
      - name: Restore edilen DB ile uygulama readiness provası
        run: |
          set -euo pipefail
          npm run build
          port=3199
          log_file=/tmp/cabukpos-restore-start.log
          DATABASE_URL="$REHEARSAL_DATABASE_URL" \
            AUTH_SECRET="$(openssl rand -hex 32)" \
            CRON_SECRET="$(openssl rand -hex 32)" \
            APP_URL="http://127.0.0.1:${port}" \
            NODE_ENV=production PORT="$port" \
            npm run start >"$log_file" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/api/ready" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          cat "$log_file"
          echo "Restore edilen veritabanıyla uygulama readiness kontrolü başarısız." >&2
          exit 1
