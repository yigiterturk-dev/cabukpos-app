name: Yedekleme

# Günlük backup gate: canlı DB'den custom-format dump alır, pg_restore katalog
# provası yapar ve dump'ı workflow artifact olarak 30 gün saklar.
# Gerekli secret: BACKUP_DATABASE_URL (Neon MIGRATE_DATABASE_URL ile aynı rol, okuma yeterli).
on:
  schedule:
    - cron: "15 3 * * *" # her gün 03:15 UTC (Türkiye sabahı)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_DIR: /tmp/cabukpos-backups
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Yedek al ve katalog provasını çalıştır
        run: npm run db:backup
      - name: Artifact'a yükle (30 gün)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cabukpos-dump-${{ github.run_id }}
          path: /tmp/cabukpos-backups/*.dump
          retention-days: 30
          if-no-files-found: error
