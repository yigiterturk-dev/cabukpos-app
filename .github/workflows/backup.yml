name: Yedekleme

# Günlük backup gate: canlı DB'den custom-format dump alır, pg_restore katalog
# provasını yapar ve şifreli dump'ı workflow artifact olarak 30 gün saklar.
# Gerekli secret'lar: BACKUP_DATABASE_URL ve BACKUP_ENCRYPTION_KEY.
on:
  schedule:
    - cron: "15 3 * * *" # her gün 03:15 UTC (Türkiye sabahı)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_DIR: /tmp/cabukpos-backups
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: PostgreSQL 18 client kur (Neon sunucusu PG18)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          for tool in pg_dump pg_restore psql; do
            sudo update-alternatives --install "/usr/bin/${tool}" "${tool}" "/usr/lib/postgresql/18/bin/${tool}" 100
          done
          pg_dump --version
      - run: npm ci
      - name: Yedek al ve katalog provasını çalıştır
        run: |
          set -euo pipefail
          test -n "$MIGRATE_DATABASE_URL" || { echo "BACKUP_DATABASE_URL repository secret eksik" >&2; exit 1; }
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo "BACKUP_ENCRYPTION_KEY repository secret eksik" >&2; exit 1; }
          npm run db:backup
      - name: Yedeği şifrele
        run: |
          set -euo pipefail
          dump="$(find /tmp/cabukpos-backups -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$dump" || { echo "Şifrelenecek dump bulunamadı" >&2; exit 1; }
          umask 077
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 310000 \
            -in "$dump" -out "${dump}.enc" -pass env:BACKUP_ENCRYPTION_KEY
          shred -u "$dump"
      - name: Şifreli artifact'a yükle (30 gün)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cabukpos-dump-${{ github.run_id }}
          path: /tmp/cabukpos-backups/*.dump.enc
          retention-days: 30
          if-no-files-found: error
