name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://cabukpos_app:dev-app-pass@127.0.0.1:5432/cabukpos_test
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cabukpos_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cabukpos_test
      AUTH_SECRET: ci-only-secret-that-is-long-enough-123456

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE cabukpos_test;
          SQL
          npm run db:push:test
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Start production server
        run: |
          nohup npm start -- -p 3810 > /tmp/cabukpos-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3810/api/health && exit 0
            sleep 1
          done
          cat /tmp/cabukpos-next.log
          exit 1
      - name: Smoke test health and readiness
        run: |
          curl --fail --silent http://127.0.0.1:3810/api/health
          curl --fail --silent http://127.0.0.1:3810/api/ready
