name: qa

# Suleyman Coder — yeni hata varsa kirilir.
# Gerekli secret/vars:
#   secrets.SULEYMANCODER_REPO  : git+https://... (tool reponuz)
#   secrets.QA_PASSWORD         : QA hesap sifresi (>=10 karakter, harf+rakam)
#   secrets.QA_DATABASE_URL     : QA/staging Postgres (temizlik icin; opsiyonel)
#   vars.QA_BASE_URL            : deployment_status yoksa hedef URL
# .qa/baseline.json commit edilmeli; yoksa ilk kosu onu olusturur (artifact'e duser).

on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # nightly; vars.QA_BASE_URL + QA_DATABASE_URL varsa

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suleymancoder:
    if: |
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success') ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && vars.QA_BASE_URL != '')
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.target_url || vars.QA_BASE_URL }}
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      SIGNUP_EMAIL: qa-${{ github.run_id }}-${{ github.run_attempt }}@example.test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check BASE_URL
        run: test -n "$BASE_URL" || { echo "::error::BASE_URL yok (vars.QA_BASE_URL)"; exit 1; }
      - name: Nightly QA prerequisites
        if: github.event_name == 'schedule'
        run: |
          test -n "$QA_DATABASE_URL" || { echo "::error::nightly icin QA_DATABASE_URL secret'i sart"; exit 1; }
          test -n "$QA_EMAIL" || { echo "::error::nightly icin sabit QA_EMAIL secret'i sart"; exit 1; }

      - name: Install Suleyman Coder
        env:
          SULEYMANCODER_REPO: ${{ secrets.SULEYMANCODER_REPO }}
          SULEYMANCODER_TOKEN: ${{ secrets.SULEYMANCODER_TOKEN }}
          SULEYMANCODER_SSH_KEY: ${{ secrets.SULEYMANCODER_SSH_KEY }}
        run: |
          test -n "$SULEYMANCODER_REPO" || { echo "::error::SULEYMANCODER_REPO secret tanimli degil"; exit 1; }
          if [ -n "$SULEYMANCODER_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SULEYMANCODER_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            REPO_URL="$SULEYMANCODER_REPO"
          elif [ -n "$SULEYMANCODER_TOKEN" ]; then
            REPO_URL=$(printf '%s' "$SULEYMANCODER_REPO" | sed "s#https://#https://x-access-token:${SULEYMANCODER_TOKEN}@#")
          else
            REPO_URL="$SULEYMANCODER_REPO"
          fi
          python -m pip install "git+$REPO_URL"
          python -m playwright install --with-deps chromium

      - name: Cleanup before
        env:
          QA_DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: |
          if [ -z "$QA_DATABASE_URL" ]; then echo "QA_DATABASE_URL yok; temizlik atlandi"; exit 0; fi
          psql "$QA_DATABASE_URL" -v ON_ERROR_STOP=1 -v qa_email="${QA_EMAIL:-}" -f .github/qa/cleanup.sql

      - name: Login QA account
        if: env.QA_EMAIL != ''
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          test -n "$QA_PASSWORD" || { echo "::error::QA_PASSWORD secret yok"; exit 1; }
          python -m suleymancoder.login --base "$BASE_URL" \
            --email "$QA_EMAIL" --password "$QA_PASSWORD" \
            --out /tmp/qa-auth.json --wait-contains /yonetim

      - name: Signup QA account
        if: env.QA_EMAIL == ''
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          SIGNUP_EMAIL: qa-${{ github.run_id }}-${{ github.run_attempt }}@example.test
        run: |
          test -n "$QA_PASSWORD" || { echo "::error::QA_PASSWORD secret yok"; exit 1; }
          python -m suleymancoder.signup --base "$BASE_URL" \
            --business "QA CI" --sector-label "Restoran" --name "QA CI" \
            --email "$SIGNUP_EMAIL" --password "$QA_PASSWORD" \
            --out /tmp/qa-auth.json --wait-contains /yonetim

      - name: RLS isolation
        if: env.QA_DATABASE_URL != ''
        run: |
          EMAIL="${QA_EMAIL:-$SIGNUP_EMAIL}"
          A=$(psql "$QA_DATABASE_URL" -Atc "select tenant_id from users where email='$EMAIL' limit 1")
          B=$(psql "$QA_DATABASE_URL" -Atc "select id from tenants where id <> '$A' limit 1")
          if [ -z "$A" ] || [ -z "$B" ]; then echo "::warning::RLS icin A/B bulunamadi; atlandi"; exit 0; fi
          psql "$QA_DATABASE_URL" -v ON_ERROR_STOP=1 -v tenant_a="$A" -v tenant_b="$B" -f .github/qa/rls.sql

      - name: QA gate
        env:
          STORAGE_STATE: /tmp/qa-auth.json
        run: |
          suleymancoder "$BASE_URL" --routes .github/qa/routes.txt \
            --storage-state /tmp/qa-auth.json \
            --baseline .qa/baseline.json --baseline-out .qa/baseline.json \
            --fail-on-new --steps 12 --minutes 1 --workers 3 --quiet

      - name: Annotate new bugs
        if: always()
        run: |
          AGG=$(ls -t suleymancoder-runs/*/aggregate.json 2>/dev/null | head -1)
          if [ -n "$AGG" ]; then python -m suleymancoder.annotate "$AGG" || true; fi

      - name: Cleanup after
        if: always()
        env:
          QA_DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: |
          if [ -z "$QA_DATABASE_URL" ]; then exit 0; fi
          psql "$QA_DATABASE_URL" -v ON_ERROR_STOP=1 -v qa_email="${QA_EMAIL:-}" -f .github/qa/cleanup.sql

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ github.run_id }}
          path: |
            suleymancoder-runs/
            .qa/baseline.json
          if-no-files-found: ignore


  selfhosted:
    # Staging URL/DB olmadan gece QA: Postgres + app ayni runner'da, veri ephemeral.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://cabukpos_app:dev-app-pass@127.0.0.1:5432/cabukpos_qa
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cabukpos_qa
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cabukpos_qa
      AUTH_SECRET: ci-only-secret-that-is-long-enough-123456
      APP_URL: http://127.0.0.1:3810
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3810
      ALLOW_FAKE_PROVIDERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Prepare ephemeral database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE cabukpos_qa;
          SQL
          npm run db:push:test
          MIGRATE_DATABASE_URL="$TEST_DATABASE_URL" npm run db:verify:billing-report
      - run: npm run build
      - name: Install Suleyman Coder
        env:
          SULEYMANCODER_REPO: ${{ secrets.SULEYMANCODER_REPO }}
          SULEYMANCODER_TOKEN: ${{ secrets.SULEYMANCODER_TOKEN }}
          SULEYMANCODER_SSH_KEY: ${{ secrets.SULEYMANCODER_SSH_KEY }}
        run: |
          test -n "$SULEYMANCODER_REPO" || { echo "::error::SULEYMANCODER_REPO secret tanimli degil"; exit 1; }
          if [ -n "$SULEYMANCODER_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SULEYMANCODER_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            REPO_URL="$SULEYMANCODER_REPO"
          elif [ -n "$SULEYMANCODER_TOKEN" ]; then
            REPO_URL=$(printf '%s' "$SULEYMANCODER_REPO" | sed "s#https://#https://x-access-token:${SULEYMANCODER_TOKEN}@#")
          else
            REPO_URL="$SULEYMANCODER_REPO"
          fi
          python -m pip install "git+$REPO_URL"
          python -m playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup npm start -- -p 3810 > /tmp/cabukpos-qa.log 2>&1 &
          for i in {1..40}; do
            curl --fail --silent http://127.0.0.1:3810/api/health && exit 0
            sleep 1
          done
          cat /tmp/cabukpos-qa.log
          exit 1
      - name: Signup and QA
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          test -n "$QA_PASSWORD" || { echo "::error::QA_PASSWORD secret yok"; exit 1; }
          python -m suleymancoder.signup --base http://127.0.0.1:3810 \
            --business "QA Selfhost" --sector-label "Restoran" --name "QA Selfhost" \
            --email qa-selfhosted@example.test --password "$QA_PASSWORD" \
            --out /tmp/qa-auth.json --wait-contains /yonetim
          suleymancoder http://127.0.0.1:3810 --routes .github/qa/routes.txt \
            --storage-state /tmp/qa-auth.json \
            --baseline .qa/baseline.json --baseline-out .qa/baseline.json \
            --fail-on-new --steps 12 --minutes 3 --workers 3 --quiet
      - name: Role smoke (mudur)
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          test -n "$QA_PASSWORD" || { echo "::error::QA_PASSWORD secret yok"; exit 1; }
          TID=$(psql "$DATABASE_URL" -Atc "select tenant_id from users where email='qa-selfhosted@example.test' limit 1")
          test -n "$TID" || { echo "::error::QA tenant bulunamadi"; exit 1; }
          HASH=$(node -e "console.log(require('bcryptjs').hashSync(process.argv[1],12))" "$QA_PASSWORD")
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "insert into users (tenant_id,email,name,password_hash,role,active) values ('$TID','qa-manager@example.test','QA Manager','$HASH','mudur',true)"
          python -m suleymancoder.login --base http://127.0.0.1:3810 \
            --email qa-manager@example.test --password "$QA_PASSWORD" \
            --out /tmp/qa-manager.json --wait-contains /yonetim
          python -m suleymancoder.security --base http://127.0.0.1:3810 \
            --storage-state /tmp/qa-manager.json --forbid /api/yonetim/veri-export
          suleymancoder http://127.0.0.1:3810 --routes .github/qa/routes.txt \
            --storage-state /tmp/qa-manager.json --out suleymancoder-runs/manager \
            --baseline .qa/baseline-manager.json --baseline-out .qa/baseline-manager.json \
            --fail-on-new --steps 6 --minutes 1 --workers 2 --quiet --no-submit \
            --ignore '403|401'
      - name: Courier device smoke
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          TID=$(psql "$TEST_DATABASE_URL" -Atc "select tenant_id from users where email='qa-selfhosted@example.test' limit 1")
          STORE=$(psql "$TEST_DATABASE_URL" -Atc "select id from stores where tenant_id='$TID' order by created_at limit 1")
          test -n "$TID" -a -n "$STORE" || { echo "::error::QA tenant/store bulunamadi"; exit 1; }
          STAFF=$(psql "$TEST_DATABASE_URL" -Atc "insert into staff (tenant_id,name,role,pin_hash) values ('$TID','QA Courier','kurye','') returning id" | head -1 | tr -d '[:space:]')
          TOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          HASH=$(node -e "console.log(require('crypto').createHash('sha256').update(process.argv[1]).digest('hex'))" "$TOKEN")
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "insert into devices (tenant_id,store_id,name,receipt_prefix,token_hash,role,paired_at) values ('$TID','$STORE','QA Courier','QAQ1','$HASH','kurye',now())"
          CODE=$(curl -sS -o /tmp/courier.json -w "%{http_code}" -X POST http://127.0.0.1:3810/api/delivery/location/session \
            -H "Origin: http://127.0.0.1:3810" -H "Content-Type: application/json" \
            -H "Cookie: cz_device=$TOKEN" -d "{\"staffId\":\"$STAFF\",\"pin\":\"\"}")
          test "$CODE" = "200" || { echo "::error::kurye session HTTP $CODE"; cat /tmp/courier.json; exit 1; }
          grep -q '"token"' /tmp/courier.json || { echo "::error::kurye token yok"; cat /tmp/courier.json; exit 1; }
          KTOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          KHASH=$(node -e "console.log(require('crypto').createHash('sha256').update(process.argv[1]).digest('hex'))" "$KTOKEN")
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "insert into devices (tenant_id,store_id,name,receipt_prefix,token_hash,role,paired_at) values ('$TID','$STORE','QA Kasa','QAQ2','$KHASH','kasa',now())"
          KCODE=$(curl -sS -o /tmp/kasa.json -w "%{http_code}" -X POST http://127.0.0.1:3810/api/delivery/location/session \
            -H "Origin: http://127.0.0.1:3810" -H "Content-Type: application/json" \
            -H "Cookie: cz_device=$KTOKEN" -d "{\"staffId\":\"$STAFF\",\"pin\":\"\"}")
          test "$KCODE" = "403" || { echo "::error::kasa kurye endpoint'ine erisebildi ($KCODE)"; cat /tmp/kasa.json; exit 1; }
          echo "kurye device + kasa 403 OK"
      - name: Annotate new bugs
        if: always()
        run: |
          AGG=$(ls -t suleymancoder-runs/*/aggregate.json 2>/dev/null | head -1)
          if [ -n "$AGG" ]; then python -m suleymancoder.annotate "$AGG" || true; fi
      - name: App log on failure
        if: failure()
        run: cat /tmp/cabukpos-qa.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-selfhosted-${{ github.run_id }}
          path: |
            suleymancoder-runs/
            .qa/baseline.json
          if-no-files-found: ignore
